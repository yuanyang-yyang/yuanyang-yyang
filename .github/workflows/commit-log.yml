name: GitHub Stats

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  commit-log:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats SVGs
        run: python3 scripts/generate_commit_log.py
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_LOGIN: yuanyang-yyang

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update GitHub stats'
          file_pattern: images/commit-log.svg images/languages.svg
